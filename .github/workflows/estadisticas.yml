# ESTADÍSTICAS (cada 3 horas): suscriptores, vistas, likes y comentarios del canal y de cada vídeo
# → estadisticas/videos.json, que Hiam enseña en Agentes › The Sentinel Global.
name: Estadisticas

on:
  schedule:
    - cron: "15 */3 * * *"
  push:
    paths:
      - "fabrica/estadisticas.py"
      - ".github/workflows/estadisticas.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: estadisticas
  cancel-in-progress: true

jobs:
  estadisticas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q google-api-python-client google-auth

      - name: Leer las cifras de YouTube
        run: python fabrica/estadisticas.py

      - name: Guardar
        run: |
          git config user.name "fabrica-bot"
          git config user.email "fabrica-bot@users.noreply.github.com"
          git add estadisticas/
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git commit -q -m "Estadísticas del canal"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          echo "::warning::No se pudo guardar"
